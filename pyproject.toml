[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mestre-ia"
version = "1.0.0"
description = "Projeto Orion — Plataforma modular de Inteligência Artificial evolutiva"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Charles Fildes"}
]
keywords = [
    "inteligencia-artificial",
    "deepseek",
    "clean-architecture",
    "ddd",
    "arquitetura-hexagonal",
    "orion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.8.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
]
memoria = [
    "sentence-transformers>=2.7.0",
]

[project.scripts]
mestre-ia = "mestre_ia.interfaces.cli.principal:app"
orion = "mestre_ia.interfaces.cli.principal:app"

[project.urls]
Homepage = "https://github.com/charlesfildes/projeto-orion"
Repository = "https://github.com/charlesfildes/projeto-orion.git"

[tool.hatch.build.targets.wheel]
packages = ["src/mestre_ia"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["testes"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers --tb=short"

[tool.coverage.run]
source = ["src/mestre_ia"]
branch = true
omit = [
    "*/test_*.py",
    "*/__pycache__/*",
]
